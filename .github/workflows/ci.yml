name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Examples run offline
        run: python scripts/run_examples.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - name: Type check and build dashboard
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build dashboard into the package
        run: npm --prefix web/frontend ci && npm --prefix web/frontend run build
      - run: pip install build
      - run: python -m build
      - name: Install wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[web]"
          cd /tmp && /tmp/clean/bin/redsi --version && /tmp/clean/bin/redsi suites
          /tmp/clean/bin/python -c "import redsi.server, pathlib; assert (pathlib.Path(redsi.server.__file__).parent / 'static' / 'index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - name: Dependency audit
        run: pip-audit --skip-editable
