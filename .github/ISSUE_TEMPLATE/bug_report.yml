name: Bug report
description: Something in RedSI does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, private URLs or confidential prompts. RedSI artifacts are redacted, but check before pasting.
        For security vulnerabilities in RedSI itself, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or code you ran and the output you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Ideally a tiny target function and test case, or a redacted run artifact.
      render: python
  - type: input
    id: version
    attributes:
      label: RedSI version (`redsi --version`)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
