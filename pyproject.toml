[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "redsi"
dynamic = ["version"]
description = "Open-source framework for adversarial testing, evaluation, and reliability engineering of AI systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Yash Jindal" }]
keywords = ["ai-evaluation", "red-teaming", "llm", "fuzzing", "testing", "reliability", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.16.10",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "build>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
redsi = "redsi.cli.main:app"

[project.urls]
Homepage = "https://github.com/Yashjindal11/redsi"
Documentation = "https://github.com/Yashjindal11/redsi/tree/main/docs"
Issues = "https://github.com/Yashjindal11/redsi/issues"

[tool.hatch.version]
path = "src/redsi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/redsi"]
# Built dashboard assets are git-ignored but must ship in wheels when present.
artifacts = ["src/redsi/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/redsi", "tests", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
artifacts = ["src/redsi/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Code samples in docs are formatted for reading, not by the formatter.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",   # line length is handled by ruff format; long data strings are fine
    "S101",   # assert is fine in tests and for internal invariants
    "S105",   # enum values like PASS are not passwords
    "S311",   # random is used for reproducible test generation, not cryptography
    "RUF012", # ClassVar annotations on pydantic models are noisy
    "ASYNC109", # explicit timeout parameters are part of the public API
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]
"benchmarks/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["redsi"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "integration: tests that exercise several subsystems end to end",
]

[tool.coverage.run]
source = ["redsi"]
branch = true
